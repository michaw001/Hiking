services:
  hiking:
    image: 192.168.1.87:5000/hiking:latest
    container_name: hiking
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data          # SQLite-Datenbank (persistent)
      - ./user_data:/app/user_data # GPX-Dateien + generierte Karten
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
