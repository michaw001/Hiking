<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hiking{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hiking.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('main.dashboard') }}">🥾 Hiking</a>
    {% if current_user.is_authenticated %}
      <div class="nav-links">
        <a href="{{ url_for('main.upload') }}">Upload</a>
        <a href="{{ url_for('main.export_xlsx') }}">Excel</a>
        <span class="nav-user">{{ current_user.username }}</span>
        <a href="{{ url_for('auth.logout') }}" class="btn-logout">Abmelden</a>
      </div>
    {% endif %}
  </nav>

  <div class="flash-messages">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
